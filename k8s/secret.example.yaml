# EXAMPLE ONLY. Never commit a real Secret or real values.
# Create the real one from the command line with a generated value:
#   kubectl -n inventory create secret generic inventory-secret \
#     --from-literal=API_KEY="$(openssl rand -hex 32)"
# The app does not read API_KEY yet; the Secret shows how secrets are mounted (see deployment.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secret
  namespace: inventory
type: Opaque
stringData:
  API_KEY: "REPLACE_ME_WITH_GENERATED_VALUE"
