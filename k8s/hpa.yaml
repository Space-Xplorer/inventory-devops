# B13 centerpiece: CPU-based autoscaling. Enable minikube metrics-server first.
# CPU utilization uses Deployment CPU requests (100m), not its 500m limit.
# Demo only: each replica has a separate SQLite database on emptyDir.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-api
  namespace: inventory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
